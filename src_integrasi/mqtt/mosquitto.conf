# Mosquitto broker config untuk alat BISINDO (Jetson).
# Broker listen di semua interface supaya HP Android (MqttDroid) bisa connect
# lewat hotspot yang sama. Python Jetson connect ke localhost:1883.

listener 1883 0.0.0.0
allow_anonymous true

# Persistence opsional; matikan kalau tidak butuh retained message bertahan reboot.
persistence false
